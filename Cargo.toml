[package]
name = "oonta"
version = "0.3.2"
edition = "2024"
description = "OCaml (subset) to LLVM IR compiler front-end"
authors = ["Fuad Ismail <fuad1502@gmail.com>"]
license = "MIT"
repository = "https://github.com/fuad1502/oonta"
readme = "README.md"
keywords = ["compiler", "ocaml", "llvm", "garbage-collection"]

[dependencies]
llvm-stackmap-parser = { version="0.1.0" }
tempfile = "3.27.0"

[build-dependencies]
jjik = { version="0.4.0" }
